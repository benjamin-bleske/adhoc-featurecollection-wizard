<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adhoc-FeatureCollection-Wizard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Adhoc-FeatureCollection-Wizard</h1>
    <ol id="stepper"></ol>
  </header>
  <main id="step-root"></main>
  <footer>
    <button id="btn-back" type="button">Zurück</button>
    <span id="status" role="status"></span>
    <button id="btn-next" type="button" class="primary">Weiter</button>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/format.js"></script>
  <script src="js/alkis.js"></script>
  <script src="js/step-area.js"></script>
  <script src="js/fachdaten.js"></script>
  <script src="js/step-fachdaten.js"></script>
  <script src="js/sensordaten.js"></script>
  <script src="js/ressorts.js"></script>
  <script src="js/datenblatt.js"></script>
  <script src="js/entwurf.js"></script>
  <script src="js/publish.js"></script>
  <script src="js/step-result.js"></script>
  <script src="js/wizard.js"></script>
</body>
</html>
